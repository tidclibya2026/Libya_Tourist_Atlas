<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>مراجعة الصور — المرحلة الثانية</title><link rel="stylesheet" href="styles.css"></head><body><header><h1>مراجعة الصور السياحية</h1><p>أداة محلية فقط؛ لا ترسل بيانات خارجيًا.</p><button id="export">تصدير JSON</button> <button id="exportCsv">تصدير CSV</button></header><main><aside><input id="search" placeholder="ID أو اسم"><select id="batch"><option value="">كل الصور</option><option value="batch-2-accommodation">Batch 2: الفنادق والمنتجعات والقرى</option><option value="batch-2a-primary-accommodation">Batch 2A: المرشحون الأساسيون للإيواء</option><option value="batch-2b-human-review">Batch 2B: المراجعة البشرية للإيواء</option><option value="batch-2c-first-25">Batch 2C: أول 25 صورة للمراجعة البشرية</option><option value="world-heritage-akakus-old-tripoli">Batch 1: التراث وأكاكوس وطرابلس القديمة</option></select><select id="destination"><option value="">كل الوجهات</option><option value="leptis">لبدة الكبرى</option><option value="sabratha">صبراتة</option><option value="cyrene">شحات / قورينا</option><option value="ghadames">غدامس</option><option value="akakus">أكاكوس</option><option value="old_tripoli">المدينة القديمة طرابلس</option><option value="rock_art">الفن الصخري</option></select><select id="priority"><option value="">كل الأولويات</option><option>PRIORITY_A</option><option>PRIORITY_B</option><option>PRIORITY_C</option></select><div id="batchOptions"><label><input type="checkbox" value="priority_only"> priority_only</label><label><input type="checkbox" value="current_links_only"> current_links_only</label><label><input type="checkbox" value="master_images_only"> master_images_only</label><label><input type="checkbox" value="rights_unknown_only"> rights_unknown_only</label><label><input type="checkbox" value="high_quality_only"> high_quality_only</label><label><input type="checkbox" value="unreviewed_only"> unreviewed_only</label></div><div id="list"></div></aside><section><img id="photo" alt="صورة المراجعة"><dl id="meta"></dl><form id="form"><label>قرار المراجع<select name="reviewer_decision"><option>defer</option><option>approve_public</option><option>approve_internal</option><option>approve_link_only</option><option>approve_as_context</option><option>approve_as_historical</option><option>reject_wrong_destination</option><option>reject_misleading</option><option>reject_quality</option><option>reject_rights</option><option>reject_duplicate_copy</option><option>cannot_determine</option></select></label><label>Feature موثق<input name="verified_feature_id"></label><label>Layer موثقة<input name="verified_layer_id"></label><label>اسم الوجهة<input name="verified_destination_name"></label><label>الدور<input name="verified_role"></label><label>المطابقة<select name="visual_match_status"><option>cannot_determine</option><option>verified_correct</option><option>probably_correct</option><option>generic_context_image</option><option>wrong_destination</option><option>misleading</option><option>logo_or_map</option><option>screenshot</option><option>personal_photo</option><option>outside_libya</option><option>ai_generated_or_uncertain</option></select></label><label>هوية الوجهة<select name="destination_identity_status"><option>cannot_determine</option><option>specific_site_confirmed</option><option>specific_component_confirmed</option><option>city_context_only</option><option>desert_context_only</option><option>heritage_context_only</option><option>architectural_context_only</option><option>not_specific_enough</option></select></label><label>الحقوق<input name="rights_status" value="unknown"></label><label>إذن النشر<input name="publication_permission" value="requires_review"></label><label>الجودة<input name="quality_decision"></label><label>قرار التكرار<input name="duplicate_decision"></label><label>المراجع<input name="reviewer_name"></label><label>التاريخ<input name="review_date" type="date"></label><label>ملاحظات<textarea name="notes"></textarea></label><button>Save Human Review / حفظ المراجعة البشرية</button></form></section></main><script src="app.js"></script></body></html>
