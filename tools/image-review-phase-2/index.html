<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>مراجعة الصور — المرحلة الثانية</title><link rel="stylesheet" href="styles.css"></head><body><header><h1>مراجعة الصور السياحية</h1><p>أداة محلية فقط؛ لا ترسل بيانات خارجيًا.</p><button id="export">تصدير القرارات JSON</button></header><main><aside><input id="search" placeholder="ID أو اسم"><select id="priority"><option value="">كل الأولويات</option><option>PRIORITY_A</option><option>PRIORITY_B</option><option>PRIORITY_C</option></select><div id="list"></div></aside><section><img id="photo" alt="صورة المراجعة"><dl id="meta"></dl><form id="form"><label>قرار المراجع<select name="reviewer_decision"><option>defer</option><option>approve_public</option><option>approve_internal</option><option>approve_link_only</option><option>reject_wrong_destination</option><option>reject_quality</option><option>reject_rights</option><option>retain_for_history</option><option>cannot_determine</option></select></label><label>Feature موثق<input name="verified_feature_id"></label><label>Layer موثقة<input name="verified_layer_id"></label><label>اسم الوجهة<input name="verified_destination_name"></label><label>الدور<input name="verified_role"></label><label>المطابقة<select name="visual_match_status"><option>cannot_determine</option><option>verified_correct</option><option>probably_correct</option><option>generic_context_image</option><option>wrong_destination</option><option>misleading</option><option>logo_or_map</option><option>screenshot</option><option>personal_photo</option><option>outside_libya</option><option>ai_generated_or_uncertain</option></select></label><label>الحقوق<input name="rights_status" value="unknown"></label><label>إذن النشر<input name="publication_permission" value="requires_review"></label><label>الجودة<input name="quality_decision"></label><label>قرار التكرار<input name="duplicate_decision"></label><label>المراجع<input name="reviewer_name"></label><label>التاريخ<input name="review_date" type="date"></label><label>ملاحظات<textarea name="notes"></textarea></label><button>حفظ محلي</button></form></section></main><script src="app.js"></script></body></html>
