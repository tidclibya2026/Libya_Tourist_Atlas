name: Deploy Libya Tourist Atlas V2.6 to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved V2.6 release
        uses: actions/checkout@v4
        with:
          ref: release/atlas-v26-20260928-014150
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/portal/package-lock.json

      - name: Install portal dependencies
        working-directory: apps/portal
        run: npm ci

      - name: Build static portal for GitHub Pages
        working-directory: apps/portal
        env:
          GITHUB_PAGES: 'true'
        run: npm run build

      - name: Validate V2.6 export
        working-directory: apps/portal
        shell: bash
        run: |
          set -euo pipefail
          test -s out/index.html
          test -f out/atlas-v23/hero/sabratha-approved.webp
          test -f out/atlas-v23/hero/sabratha.webp
          test -f out/atlas-v23/hero/leptis-magna.webp
          test -f out/atlas-v23/hero/ghadames.webp
          grep -q '/Libya_Tourist_Atlas/atlas-v23/' out/index.html
          grep -q '/Libya_Tourist_Atlas/_next/' out/index.html
          touch out/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload ONLY the Next.js static export
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/portal/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish V2.6 site
        id: deployment
        uses: actions/deploy-pages@v4
